[pytest]
# I test stanno in tests/, non in src/: con testpaths=src pytest non ne
# raccoglierebbe nessuno. La copertura si misura invece su src/, che e' il
# codice sotto esame - in minuscolo, perche' su Linux (dove gira la CI) il
# filesystem distingue le maiuscole e la cartella 'Src' non esiste.
testpaths = tests
python_files = test_*.py
addopts = --cov=src --cov-report=term --cov-fail-under=75
