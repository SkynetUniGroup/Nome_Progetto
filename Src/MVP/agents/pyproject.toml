[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code_guardian_agents"
version = "1.0.0"
description = "Python agent service for Code Guardian (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "langgraph>=0.2.20",
    # Tetto voluto, non una svista: da 0.3 il pacchetto ha rimosso il
    # modulo `langgraph.checkpoint.mongodb.aio` e con esso
    # `AsyncMongoDBSaver`, che src/main.py importa alla riga 5. Con un
    # `>=0.2.0` aperto pip risolve all'ultima (0.5.x) e main.py smette di
    # essere importabile: `ModuleNotFoundError`. Per alzare il tetto va
    # prima riscritto main.py sull'API nuova (`MongoDBSaver`).
    "langgraph-checkpoint-mongodb>=0.2.0,<0.3.0",
    "motor>=3.3.2",
    "langchain-openai>=0.1.1",
    "langchain-aws>=0.1.6",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    # pytest.ini passa `--cov=src --cov-fail-under=75` in addopts: senza
    # questo plugin pytest si ferma subito con "unrecognized arguments".
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    # Invocati dai workflow di CI (`python -m pylint .`, con .pylintrc in
    # questa cartella) e da lint-staged (`python -m black`).
    "pylint>=3.0.0",
    "black>=24.0.0",
]
