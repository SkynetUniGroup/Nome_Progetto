services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides the values from .env: inside the Docker network, containers
      # reach each other by service name, never by localhost.
      MONGODB_URI: mongodb://mongodb:27017/codeguardian
      REDIS_URL: redis://redis:6379
      # BE-20: same reasoning — the container reaches MinIO by service name.
      S3_ENDPOINT: http://minio:9000
      # File-change notifications from a Windows bind mount don't reliably
      # reach the Linux container, so the TypeScript watcher has to poll for
      # changes instead of waiting for them — without this, edits on the host
      # are silently ignored until the container is restarted.
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
      - minio

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for exported PDF artifacts (BE-20). The
  # backend creates the bucket and its 30-day expiry lifecycle rule itself
  # on startup (ReportArtifactStorageService.onModuleInit) — nothing to
  # provision here beyond the server. Console at :9001 (default
  # minioadmin/minioadmin, matching .env.example) is only for poking around
  # manually; the app never uses it.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Python agents service (FastAPI/Uvicorn on :8000, per agents/Dockerfile).
  # Not exposed to the host — only reachable from other containers, at
  # http://agents:8000, matching AGENTS_SERVICE_URL in backend/.env.
  agents:
    build: ./agents
    env_file:
      - ./agents/.env
    environment:
      # Same override rationale as the backend service: inside the Docker
      # network, containers reach each other by service name, never by
      # localhost or the backend's own hostnames.
      BACKEND_BASE_URL: http://backend:3000
      MONGO_URI: mongodb://mongodb:27017/codeguardian
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  minio_data:
